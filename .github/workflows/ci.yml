name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:

  checks:

    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python versions
      uses: actions/setup-python@v5
      with:
        python-version: |
            3.11
            3.12
            3.13
            3.14

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      run: uv sync --only-dev

    - name: Check code quality
      run: uv run nox -s checks -- quality

    - name: Check type annotations
      run: uv run nox -s checks -- types

    - name: Check vulnerabilities in dependencies
      run: uv run nox -s checks -- dependencies

    - name: Check security issues
      run: uv run nox -s checks -- security

    - name: Check docstring coverage
      run: uv run nox -s checks -- docs

  lean:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build the Lean library without Sage
      uses: leanprover/lean-action@v1
      with:
        use-mathlib-cache: true
        test: false
        lint: false

    - name: Build the Sage-free kit tests
      run: lake build VeriphyTest.Kit VeriphyTest.Graph

  integration:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    container:
      image: sagemath/sagemath:10.10
      options: --user root

    steps:
    - name: Install git, so the checkout carries the tags the version is derived from
      run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Trust the workspace for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
        python-version: '3.13'

    - name: Install dependencies
      run: uv sync --only-dev

    - name: Install elan
      run: |
        curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Cache the Open Ontologies checker
      uses: actions/cache@v4
      with:
        path: ~/.cache/veriphy/open-ontologies
        key: oo-horn-${{ hashFiles('src/veriphy/primitives/graph/_checker.py') }}

    - name: Set up the checker and the reasoner of the pinned Open Ontologies release
      run: uv run --extra graph python -m veriphy.claims checker build

    - name: Install the built wheel into SageMath
      run: |
        uv build
        sage -pip install dist/*.whl

    - name: Cache Lean toolchain and packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.elan
          .lake
        key: lean-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

    - name: Run the tactic suite against the installed daemon
      run: |
        lake exe cache get
        lake build VeriphyTest

    # after the Lean build, so the tests that run Lean (the Lean steps, the emitted-proof checks) do not skip
    - name: Run the test suite on SageMath, with the checker required
      run: uv run nox -s tests
      env:
        VERIPHY_REQUIRE_CHECKER: '1'

    - name: Reproduce the example analysis in the pinned R image
      run: |
        cd "$(mktemp -d)"
        cp "$GITHUB_WORKSPACE"/src/veriphy/packs/reproduction/example/* .
        printf 'version: 1\npacks: [reproduction]\n' > veriphy.yaml
        uv run --project "$GITHUB_WORKSPACE" veriphy reproduce analysis.R mtcars.csv \
          450a97ba6b438c6ea5bdf2aaac7eab0ecbbf812b5ff74b56f62dcf0a0c7eb0e5 --claimed -5.344472 --claim mpg-weight
        uv run --project "$GITHUB_WORKSPACE" veriphy vary analysis.R mtcars.csv \
          450a97ba6b438c6ea5bdf2aaac7eab0ecbbf812b5ff74b56f62dcf0a0c7eb0e5 '["mpg ~ wt + hp", "mpg ~ wt + cyl"]'

    - name: Run the research workflow on a fixture chapter, over a Lean export, setting up on first use
      run: |
        printf 'import VeriphyTest.Graph\n#veriphy export GraphTest\n' > Export.lean
        lake env lean Export.lean
        XDG_CACHE_HOME="$(mktemp -d)" tests/graph/fixtures/workflow/run.sh "$(uv run --extra graph which python)"

  doc:

    if: ${{ github.ref != 'refs/heads/main' }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Build documentation with Python ${{ matrix.python-version }}
      run: uv run nox -s docs -- build
