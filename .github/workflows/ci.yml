name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:

  checks:

    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python versions
      uses: actions/setup-python@v5
      with:
        python-version: |
            3.11
            3.12
            3.13
            3.14

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install dependencies
      run: uv sync --only-dev

    - name: Check code quality
      run: uv run nox -s checks -- quality

    - name: Check type annotations
      run: uv run nox -s checks -- types

    - name: Check vulnerabilities in dependencies
      run: uv run nox -s checks -- dependencies

    - name: Check security issues
      run: uv run nox -s checks -- security

    - name: Check docstring coverage
      run: uv run nox -s checks -- docs

  lean:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build the Lean library without Sage
      uses: leanprover/lean-action@v1
      with:
        use-mathlib-cache: true
        test: false
        lint: false

    - name: Build the Sage-free kit tests
      run: lake build VeriphyTest.Kit

  integration:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    container:
      image: sagemath/sagemath:10.10
      options: --user root

    steps:
    - name: Install git, so the checkout carries the tags the version is derived from
      run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Trust the workspace for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
        python-version: '3.13'

    - name: Install dependencies
      run: uv sync --only-dev

    - name: Run the test suite on SageMath
      run: uv run nox -s tests

    - name: Install the built wheel into SageMath
      run: |
        uv build
        sage -pip install dist/*.whl

    - name: Cache Lean toolchain and packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.elan
          .lake
        key: lean-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

    - name: Install elan
      run: |
        curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Run the tactic suite against the installed daemon
      run: |
        lake exe cache get
        lake build VeriphyTest

  doc:

    if: ${{ github.ref != 'refs/heads/main' }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Build documentation with Python ${{ matrix.python-version }}
      run: uv run nox -s docs -- build
