name = "veriphy"
defaultTargets = ["Veriphy", "VeriphyCheck"]

[[lean_lib]]
name = "Veriphy"

# Reflective checkers with soundness theorems; imports mathlib only, so proofs using them build without Sage
[[lean_lib]]
name = "VeriphyCheck"

# Tactic tests exercise the live Sage daemon: `lake build VeriphyTest`
# (`VeriphyTest.Kit` is Sage-free: `lake build VeriphyTest.Kit`)
[[lean_lib]]
name = "VeriphyTest"
globs = ["VeriphyTest", "VeriphyTest.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

# Recipe assets a project copies into `.veriphy/lean/` (mathlib only); built here so they stay checked
[[lean_lib]]
name = "VeriphyAssets"
srcDir = "assets"
