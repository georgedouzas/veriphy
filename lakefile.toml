name = "veriphy"
defaultTargets = ["Veriphy"]

[[lean_lib]]
name = "Veriphy"

# Tactic tests exercise the live Sage daemon: `lake build VeriphyTest`
# (`VeriphyTest.Kit` is Sage-free: `lake build VeriphyTest.Kit`)
[[lean_lib]]
name = "VeriphyTest"
globs = ["VeriphyTest", "VeriphyTest.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"
