# A pack for history: check that a quoted passage appears, word for word, in the source it is attributed to.
version: 1
name: history

levels:
  quoted:
    trust: checker
    above: none
    description: The passage appears word for word in the cited source.

# two editions of a text are conventions of one aspect: a claim resting on both is a clash in the claim graph
conventions:
  edition: [first-edition, second-edition]

tools:
  find-quote:
    # a command run once per call, which reads {input} and writes its result to {out}
    contract: files
    run: ['{python}', '{pack}/find_quote.py']

primitives:
  quote.find:
    tool: find-quote
    command: ['{input}', '{out}']
    trust: checker
    input:
      type: object
      required: [source, passage]
      properties: {source: {type: string}, passage: {type: string}}
    output:
      type: object
      required: [status]
      properties: {status: {enum: [found, missing]}, line: {type: integer}}

steps:
  verify-quote:
    kind: check
    primitive: quote.find
    grants: quoted
    # the tool says found or missing: found is success, so missing is recorded as refused
    accepts: [found]
    help: check that a passage appears, word for word, in its source
    inputs:
      source: {scope: file, path: true, help: the source, as plain text}
      passage: {help: the quoted passage}
      claim: {optional: true, record: true, help: 'the claim, so its level follows the record'}
