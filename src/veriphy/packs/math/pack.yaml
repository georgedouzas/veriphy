version: 1
name: math
requires: [lean]

tools:
  sage:
    contract: jsonrpc
    # VERIPHY_SAGE_CMD and VERIPHY_SAGE_SERVER override the command, as they do for the Lean bridge
    run: ['{env:VERIPHY_SAGE_CMD|sage}', -python, '{env:VERIPHY_SAGE_SERVER|-m veriphy.packs.math.primitives.sage}']
    version: {method: ping, field: sage, pattern: 'version ([0-9.]+)'}
    timeout: 600

primitives:
  sage.ping:
    tool: sage
    method: ping
    trust: oracle
    input: {type: object, maxProperties: 0}
    output:
      type: object
      required: [ok, sage, veriphy]
      properties: {ok: {const: true}, sage: {type: string}, veriphy: {type: string}}

  sage.search:
    tool: sage
    method: run
    trust: search
    input:
      type: object
      required: [problem, script]
      properties:
        problem: {type: object, description: the goal as `veriphy certify` serializes it}
        script: {type: string, description: a script following the script contract}
        timeout_s: {type: integer, minimum: 1}
    output:
      type: object
      required: [lean, stdout, leaves_goals]
      properties:
        lean: {type: string, description: the candidate tactic block}
        stdout: {type: string}
        leaves_goals: {type: boolean}
        deprecated: {type: string}

  sage.compute:
    tool: sage
    method: run_script
    trust: oracle
    input:
      type: object
      required: [script]
      properties: {script: {type: string}, timeout_s: {type: integer, minimum: 1}}
    output:
      type: object
      required: [stdout, advisory]
      properties: {results: {}, stdout: {type: string}, advisory: {const: true}}

  sage.sample:
    tool: sage
    method: meaning
    trust: oracle
    seed: param
    input:
      type: object
      required: [problem]
      properties:
        problem: {type: object, description: the claim as `lean.serialize` gives it}
        seed: {type: integer, minimum: 0}
        values: {type: integer, minimum: 1}
        points: {type: [array, 'null'], items: {type: object, additionalProperties: {type: string}}}
    output:
      type: object
      required: [outcome, seed]
      properties:
        outcome: {enum: [agrees, counterexample, undecided]}
        method: {enum: [symbolic, sampled]}
        seed: {type: integer}

  sage.instances:
    tool: sage
    method: test
    trust: search
    input:
      type: object
      required: [problem, script]
      properties: {problem: {type: object}, script: {type: string}, timeout_s: {type: integer, minimum: 1}}
    output:
      type: object
      required: [instances, stdout, seed, sage_version]
      properties:
        instances: {type: array, items: {type: object}}
        stdout: {type: string}
        seed: {type: integer}
        sage_version: {type: string}
        deprecated: {type: string}

  sage.solve:
    tool: sage
    method: solve
    trust: oracle
    input: {type: object}
    output: {type: object}

  sage.symbolic_check:
    tool: sage
    method: symbolic_check
    trust: oracle
    input: {type: object}
    output: {type: object}

  sage.matrix_check:
    tool: sage
    method: matrix_check
    trust: oracle
    input: {type: object}
    output: {type: object}
