version: 1
name: social-science
# the social sciences: a study's analysis and its robustness (from the statistics pack), the reliability of its scales,
# its sampling, and its constructs against a thesaurus (the framework's check-concepts); with pingouin
requires: [statistics]

conventions:
  # how the sample was drawn
  sampling: [probability-sample, convenience-sample]

primitives:
  scale.alpha:
    function: veriphy.packs.social_science.primitives._reliability:cronbach_alpha
    trust: reproduction
    input:
      type: object
      required: [data, items]
      properties: {data: {type: string}, items: {type: array, items: {type: string}}}
    output: {type: object, required: [status]}

steps:
  check-reliability:
    kind: evidence
    primitive: scale.alpha
    compare: {field: alpha, against: claimed, tolerance: reported}
    help: "recompute a scale's Cronbach's alpha from its items, and compare it with the reported value"
    inputs:
      data: {scope: file, path: true, help: the survey data, as CSV}
      items: {many: true, flag: --item, help: "a column of the scale; repeat for each"}
      claimed: {type: number, optional: true, record: true, help: the alpha the study reports}
      claim: {optional: true, record: true, help: the claim the scale belongs to}

workflows:
  check-study: [record-claims, check-concepts, reproduce, robustness]
