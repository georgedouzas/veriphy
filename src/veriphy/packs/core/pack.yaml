version: 1
name: core

levels:
  # the bottom of the chain: neither proved nor tested
  none: {description: Neither proved in Lean nor tested by Veriphy.}

steps:
  # Python steps of the claims layer, listed here so the configuration names every step
  validate: {code: veriphy.claims}
  reason: {code: veriphy.claims}
  appendix: {code: veriphy.claims}
  check-concepts: {code: veriphy.packs.core.claims}
  record-statement:
    kind: agent
    help: record the file holding the formal statement an agent wrote, with its author
    inputs:
      artifact: {scope: file, path: true, help: the file holding the formal statement}
  record-claims:
    kind: agent
    help: record the file holding the claims an agent extracted from a source, with their author
    inputs:
      artifact: {scope: file, path: true, help: the file holding the extracted claims}

primitives:
  horn.check:
    # oo-horn from the pinned Open Ontologies release, set up on first use; the output names its commit
    function: veriphy.primitives.graph._primitives:horn_check
    trust: checker
    input:
      type: object
      required: [certificate]
      properties: {certificate: {type: string, description: the certificate directory}}
    output:
      type: object
      required: [status]
      properties: {status: {enum: [accepted, rejected, unreadable, unchecked_error]}}

  shacl.validate:
    function: veriphy.primitives.graph._primitives:shacl_validate
    trust: measurement
    input:
      type: object
      required: [data, shapes]
      properties: {data: {type: string}, shapes: {type: string}}
    output:
      type: object
      required: [conforms, violations]
      properties: {conforms: {type: boolean}, violations: {type: array, items: {type: object}}}
