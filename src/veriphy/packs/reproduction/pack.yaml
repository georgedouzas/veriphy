version: 1
name: reproduction
requires: [core]

levels:
  reproduced: {trust: reproduction, above: none, description: 'The same estimate from the same code, data and environment.'}
  robust: {trust: reproduction, above: reproduced, description: 'Reproduced, and its sign and significance hold under every declared variation.'}

conventions:
  # an identification assumption: a claim resting on one clashes with a claim it cites that assumes the other
  identification: [parallel-trends, no-parallel-trends]

tools:
  r:
    contract: files
    run: [Rscript]
    pin: {image: 'rocker/r-ver:4.4.1@sha256:78cb94ce2db23aaaf7b546450fcf70b5a3f2ace5a9b5fa1f87217da329211312'}
    timeout: 600

primitives:
  r.exec:
    tool: r
    trust: reproduction
    seed: placeholder
    command: ['{file:runner}', '{file:script}', '{file:data}', '{seed}', '{out}', '{file:variation}']
    input:
      type: object
      required: [runner, script, data, variation]
      properties:
        runner: {type: string}
        script: {type: string}
        data: {type: string}
        variation: {type: string, description: a file holding the variation, empty for the analysis as published}
        seed: {type: integer}
    output: {type: object, required: [status, estimate, se]}
  # composites, written in code
  r.run: {composite: veriphy.packs.reproduction.primitives}
  r.robustness: {composite: veriphy.packs.reproduction.primitives}

steps:
  reproduce:
    kind: check
    primitive: r.run
    grants: reproduced
    seed: true
    compare: {field: estimate, against: claimed, tolerance: 0.000001}
    help: run the authors' script on the named data in the pinned image, and compare the estimate with the claim's
    inputs:
      script: {scope: file, path: true, help: the analysis script}
      data: {scope: file, path: true, help: the data}
      sha256: {help: "the data's SHA-256, as the claim names it"}
      claimed: {type: number, optional: true, record: true, help: the estimate the claim reports}
      claim: {optional: true, record: true, help: the claim, so its level follows the record}
  vary:
    kind: check
    primitive: r.robustness
    grants: robust
    seed: true
    help: run the declared variations, and grant robust when the estimate's sign and significance hold under each
    inputs:
      script: {scope: file, path: true}
      data: {scope: file, path: true}
      sha256: {}
      variations: {type: json, help: 'the variations, declared before running, as JSON: ["mpg ~ wt + hp"]'}
      claim: {optional: true, record: true}

workflows:
  reproduce-analysis: [extract, reproduce, vary]
